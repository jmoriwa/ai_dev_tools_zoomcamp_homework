services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: littleboard
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littleboard -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: integration-only
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pintegration-only --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    tmpfs:
      - /var/lib/mysql
